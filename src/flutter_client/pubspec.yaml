name: pharmacy_management_system
description: Production-Ready Cross-Platform Pharmacy Management System for Windows and Android.
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Local Database (Offline First)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking & REST API
  dio: ^5.4.1
  connectivity_plus: ^5.0.2

  # Thermal Printing & Barcodes
  blue_thermal_printer: ^1.2.3
  printing: ^5.12.0
  pdf: ^3.10.7
  barcode_widget: ^2.0.4

  # Hardware Barcode Scanner & USB
  flutter_barcode_listener: ^0.1.3

  # UI & Icons
  intl: ^0.19.0
  uuid: ^4.3.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
